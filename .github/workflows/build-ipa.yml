name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pick newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          swift --version
          xcrun -sdk iphoneos -show-sdk-path

      - name: Install xtool
        run: |
          brew install xtool-org/tap/xtool
          xtool --help | head -5

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            .build/artifacts
            .build/checkouts
            .build/repositories
          key: spm-${{ hashFiles('Package.swift', 'Package.resolved') }}

      - name: Build IPA with xtool
        run: |
          set -o pipefail
          xtool dev build --ipa -c release 2>&1 | tee build.log

      - name: Check IPA
        run: |
          ls -la xtool
          unzip -l xtool/Harbor.ipa | head -40
          unzip -l xtool/Harbor.ipa | tail -1

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Harbor-ipa
          path: xtool/Harbor.ipa
          if-no-files-found: error

      - name: Publish IPA as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" xtool/Harbor.ipa build.log \
            --title "Harbor for iPhone (build ${{ github.run_number }})" \
            --notes "Unsigned IPA built with xtool from ${{ github.sha }}. Install with Sideloadly or AltStore."
          echo "::notice title=IPA size::$(stat -f%z xtool/Harbor.ipa) bytes"

      - name: Report errors
        if: failure()
        run: |
          grep -E "error:|warning: .*deprecated" build.log | head -40 | while IFS= read -r line; do
            echo "::error::${line}"
          done || true
          gh release create "failed-${{ github.run_number }}" build.log --prerelease --title "Failed build ${{ github.run_number }}" --notes "build log" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
